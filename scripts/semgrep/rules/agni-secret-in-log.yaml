rules:
  - id: agni-secret-in-log
    languages: [typescript]
    severity: ERROR
    message: >-
      A value whose name says it is a secret (key, token, password,
      authorization, credential) is passed to a log call. Logs are written to
      disk and read by people and tools. Log that the value exists, or its
      length, or redact() it; never the value.
    metadata:
      category: security
      cwe: "CWE-532: Insertion of Sensitive Information into Log File"
      owasp: "A09:2021 - Security Logging and Monitoring Failures"
      sprint: S3-11
    patterns:
      - pattern-either:
          - pattern: console.$M(..., $X, ...)
          - pattern: console.$M(..., `...${$X}...`, ...)
          - pattern: log.$M(..., $X, ...)
          - pattern: log.$M(..., `...${$X}...`, ...)
          - pattern: logger.$M(..., $X, ...)
          - pattern: logger.$M(..., `...${$X}...`, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^(log|debug|info|warn|error|trace)$
      - metavariable-regex:
          metavariable: $X
          regex: (?is)\A(?!.*(redact|mask|length|count|hash|\bhas|\bis)).*(api[_-]?key|secret|passw(or)?d|passphrase|authorization|credential|private[_-]?key|(access|refresh|bearer|auth|session|device|share|pairing|oauth|id)[_-]?token)
